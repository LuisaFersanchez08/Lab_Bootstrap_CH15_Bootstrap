<!--
============================================================
Página CONTACTO Y PEDIDOS · Sabores de la Plaza
Ejercicios 01, 02, 06, 07 y 08
============================================================
Escribe tu HTML DEBAJO de este comentario.

Ejercicios 01 y 02 · Igual que en index.html
  - Bootstrap instalado y la MISMA barra de navegación.

Ejercicio 06 · El formulario
  - Campos: nombre (type="text"), teléfono o correo (type="tel" o
    type="email"), un <select> con al menos 3 puestos y un
    <textarea> para el mensaje.
  - Cada campo con su <label for="..."> igual a su id.
  - Clases de Bootstrap: form-control (form-select en el select).
  - Un <button type="submit"> con btn y un color (btn-primary…).
  - Centrado y sin ocupar todo el ancho en pantalla grande:
    la fila con justify-content-center y la columna menor a 12.

Ejercicio 07 · Más componentes de la documentación
  - Preguntas frecuentes (Components → Accordion), al menos 3.
  - Y uno de estos dos: un modal (Components → Modal) o unas
    pestañas (Components → Navs and tabs). Aquí o en otra página.

Ejercicio 08 · La letra
  - El mismo <link> de Google Fonts que en index.html.
============================================================
-->

<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">

        <a class="navbar-brand" href="index.html">
            Sabores de la Plaza
        </a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
            aria-controls="menu"
            aria-expanded="false"
            aria-label="Abrir menú">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="puestos.html">Puestos</a>

                    <a class="nav-link" href="contacto.html">Contacto</a>

            </ul>

</nav>


<div class="container my-5">
    <h1 class="text-center mb-4">Contáctanos</h1>

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <form>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre">
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" name="correo">
                </div>

                <div class="mb-3">
                    <label for="puesto" class="form-label">Selecciona un puesto</label>
                    <select class="form-select" id="puesto" name="puesto">
                        <option value="">Selecciona una opción</option>
                        <option value="frutas">Frutas</option>
                        <option value="panaderia">Panadería</option>
                        <option value="almuerzos">Almuerzos</option>
                        <option value="jugos">Jugos</option>
                        <option value="cafe">Café</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea class="form-control" id="mensaje" name="mensaje" rows="4"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Enviar mensaje</button>
            </form>

        </div>
    </div>
</div>

<footer class="bg-success text-white text-center p-4">
    <p>Sabores de la Plaza</p>
    <p>Unidos por el sabor y el comercio local fresquito.</p>
    <p>Contacto: saboresdelaplaza@email.com</p>
</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
